
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Group Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 30px;
            color: #333;
        }

        header {
            background: #c62828;
            color: white;
            text-align: center;
            padding: 22px;
            border-radius: 10px;
        }

        .container {
            max-width: 800px;
            margin: 25px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #ddd;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #c62828;
            color: white;
        }

        a {
            color: #c62828;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>Blood Group Report</h1>
        <p>Blood Bank Management System</p>
    </header>

    <div class="container">
        <h2>Donor Summary</h2>
        <p>This page will display the number of registered donors in each blood group.</p>

        <table>
            <thead>
                <tr>
                    <th>Blood Group</th>
                    <th>Number of Donors</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>A+</td><td>—</td></tr>
                <tr><td>A-</td><td>—</td></tr>
                <tr><td>B+</td><td>—</td></tr>
                <tr><td>B-</td><td>—</td></tr>
                <tr><td>AB+</td><td>—</td></tr>
                <tr><td>AB-</td><td>—</td></tr>
                <tr><td>O+</td><td>—</td></tr>
                <tr><td>O-</td><td>—</td></tr>
            </tbody>
        </table>

        <p><a href="index.html">← Back to Home</a></p>
    </div>
</body>
</html>
