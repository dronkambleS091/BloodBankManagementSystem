<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Donor - Blood Bank</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #ddd;
        }

        h1 {
            text-align: center;
            color: #b71c1c;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #b71c1c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #b71c1c;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🩸 Donor Registration</h1>

       <form id="donorForm" action="DonorServlet" method="post">
            <label for="full_name">Full Name</label>
           <input type="text" id="full_name" name="full_name" required>

            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="18" max="100" step="1" required>

            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <label for="blood_group">Blood Group</label>
           <select id="blood_group" name="blood_group" required>
                <option value="">Select Blood Group</option>
                 <option value="A+">A+</option>
                 <option value="A-">A-</option>
                 <option value="B+">B+</option>
                 <option value="B-">B-</option>
                 <option value="AB+">AB+</option>
                 <option value="AB-">AB-</option>
                 <option value="O+">O+</option>
                 <option value="O-">O-</option>
            </select>

            <label for="phone">Phone Number</label>
           <input type="tel" id="phone" name="phone" maxlength="20" required>

            <label for="email">Email</label>
          <input type="email" id="email" name="email">

            <label for="address">Address</label>
            <textarea id="address" name="address" rows="3"></textarea>

            <button type="submit">Register Donor</button>
        </form>

        <a class="back" href="index.html">Back to Home</a>
    </div>

</body>
</html>
